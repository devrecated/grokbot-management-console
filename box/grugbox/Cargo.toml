[package]
name = "grugbox"
version = "0.1.0"
edition = "2021"
description = "GrugBot Console box agent: collects, redacts and ships logs, heartbeat, CPU/memory, bot activity, token estimates and the Live stream. One small binary."
license = "MIT"

[dependencies]
# Kept to four small, well known crates. HTTP goes through the system curl, so no TLS stack here.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
